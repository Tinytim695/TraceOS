name: TraceOS Security Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: traceos-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install security tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-bandit

      - name: ShellCheck
        run: |
          shellcheck \
            build.sh \
            config/hooks/live/*.hook.chroot \
            config/includes.chroot/usr/local/bin/traceos-osint \
            config/includes.chroot/usr/local/bin/traceos-session \
            config/includes.chroot/usr/local/bin/traceos-update \
            config/includes.chroot/usr/local/bin/traceos-session-hardening \
            config/includes.chroot/usr/local/bin/traceos-evidence-mount \
            config/includes.chroot/usr/local/bin/traceos-evidence-umount \
            config/includes.chroot/usr/local/bin/blackbird

      - name: Python compile check
        run: |
          python3 -m py_compile config/includes.chroot/usr/local/bin/traceos config/includes.chroot/usr/local/bin/traceos_case.py config/includes.chroot/usr/local/bin/traceos-control config/includes.chroot/usr/local/bin/traceos-shade

      - name: Bandit
        run: |
          bandit -q -lll -iii config/includes.chroot/usr/local/bin/traceos config/includes.chroot/usr/local/bin/traceos_case.py config/includes.chroot/usr/local/bin/traceos-control config/includes.chroot/usr/local/bin/traceos-shade

      - name: Secret pattern scan
        shell: bash
        run: |
          if git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+|sk-[A-Za-z0-9]{20,})' -- .; then
            echo "Potential secret-like material found in tracked files."
            exit 1
          fi


      - name: Blackbird dependency consistency
        shell: bash
        run: |
          cmp -s config/third-party/blackbird-requirements.txt \
            config/includes.chroot/usr/share/traceos/blackbird-requirements.txt

      - name: Python dependency audit
        shell: bash
        run: |
          python3 -m venv /tmp/traceos-audit
          /tmp/traceos-audit/bin/pip install --disable-pip-version-check --quiet pip-audit
          /tmp/traceos-audit/bin/pip-audit -r config/third-party/blackbird-requirements.txt

      - name: Destructive-command guard
        shell: bash
        run: |
          if git grep -nEI '(^|[[:space:]])(wipefs|mkfs([.][A-Za-z0-9._+-]+)?|dd[[:space:]]+if=|shred)([[:space:]]|$)' -- config/includes.chroot/usr/local/bin config/includes.chroot/etc/skel; then
            echo "Potential destructive storage command found in shipped user-facing files."
            exit 1
          fi
