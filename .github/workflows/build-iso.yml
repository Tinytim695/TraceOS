name: Build TraceOS ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: traceos-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            qemu-utils \
            qemu-system-x86 \
            gettext \
            po4a \
            debian-archive-keyring \
            file \
            imagemagick \
            shellcheck

      - name: "Static preflight: syntax, shebangs and manifests"
        env:
          TRACEOS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/preflight-static.sh
          scripts/preflight-static.sh

      - name: Install pinned live-build
        run: |
          rm -rf /tmp/live-build /tmp/live-build.tar.gz
          timeout 180s curl -fsSL --retry 5 --retry-delay 2 --max-time 180 \
            https://salsa.debian.org/live-team/live-build/-/archive/531cdb98/live-build-531cdb98.tar.gz \
            -o /tmp/live-build.tar.gz
          mkdir -p /tmp/live-build
          tar -xzf /tmp/live-build.tar.gz -C /tmp/live-build --strip-components=1
          cd /tmp/live-build
          sudo make install
          lb --version

      - name: Host-side case backbone tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate ISO
        run: |
          test -s live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso
          xorriso -indev live-image-amd64.hybrid.iso -report_el_torito plain -report_system_area plain | tee traceos-iso-layout.txt
          grep -q "El Torito" traceos-iso-layout.txt
          sha256sum live-image-amd64.hybrid.iso | tee traceos-0.1.0-amd64.iso.sha256

      - name: Validate built graphics bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/traceos-root /tmp/traceos-filesystem.squashfs
          xorriso -osirrox on -indev live-image-amd64.hybrid.iso \
            -extract /live/filesystem.squashfs /tmp/traceos-filesystem.squashfs
          test -s /tmp/traceos-filesystem.squashfs
          unsquashfs -no-xattrs -q -d /tmp/traceos-root /tmp/traceos-filesystem.squashfs
          test -f /tmp/traceos-root/etc/systemd/system/traceos-qemu-graphics.service
          test -x /tmp/traceos-root/usr/local/sbin/traceos-qemu-graphics
          test -f /tmp/traceos-root/etc/systemd/system/traceos-qemu-ui-diagnostics.service
          test -x /tmp/traceos-root/usr/local/sbin/traceos-qemu-ui-diagnostics
          test -L /tmp/traceos-root/etc/systemd/system/graphical.target.wants/traceos-qemu-graphics.service
          test -L /tmp/traceos-root/etc/systemd/system/graphical.target.wants/traceos-qemu-ui-diagnostics.service
          echo "[TraceOS] QEMU graphics bootstrap and GUI diagnostic collector are present and enabled in the final squashfs."

          # Validate branded launcher/home-screen components from the built squashfs.
          test -x /tmp/traceos-root/usr/local/bin/traceos-launcher
          test -x /tmp/traceos-root/usr/local/bin/traceos-desktop-setup
          wallpaper_png=/tmp/traceos-root/usr/share/backgrounds/traceos/traceos-wallpaper.png
          test -s "$wallpaper_png"
          test -s /tmp/traceos-root/usr/local/lib/traceos/desktop_wallpaper.py
          wallpaper_dimensions="$(identify -format '%w %h' "$wallpaper_png")"
          test "$wallpaper_dimensions" = "1920 1080"
          wallpaper_mean="$(convert "$wallpaper_png" -format '%[fx:mean]' info:)"
          if ! awk -v mean="$wallpaper_mean" 'BEGIN { exit !(mean+0 > 0.25) }'; then
            echo "[TraceOS] Packaged wallpaper is too dark (mean=$wallpaper_mean)." >&2
            exit 1
          fi
          echo "[TraceOS] Packaged wallpaper mean luminance: $wallpaper_mean"
          wallpaper_sha256="$(sha256sum "$wallpaper_png" | awk '{print $1}')"
          printf 'TRACEOS_PACKAGED_WALLPAPER_DIMENSIONS=%s\nTRACEOS_PACKAGED_WALLPAPER_SHA256=%s\n' \
            "$wallpaper_dimensions" "$wallpaper_sha256" | tee -a traceos-iso-layout.txt
          test -s /tmp/traceos-root/etc/xdg/autostart/traceos-launcher.desktop
          grep -Fq 'Exec=/usr/local/bin/traceos-launcher' /tmp/traceos-root/etc/xdg/autostart/traceos-launcher.desktop
          grep -Fq 'Hidden=true' /tmp/traceos-root/etc/xdg/autostart/traceos-control.desktop
          test -s /tmp/traceos-root/etc/xdg/menus/xfce-applications.menu
          grep -Fq '<Menuname>TraceOS</Menuname>' /tmp/traceos-root/etc/xdg/menus/xfce-applications.menu
          grep -Fq '<Category>TraceOS</Category>' /tmp/traceos-root/etc/xdg/menus/xfce-applications.menu
          for app in traceos-launcher traceos-control traceos-osint traceos-shade traceos-console; do
            test -s "/tmp/traceos-root/usr/share/icons/hicolor/scalable/apps/$app.svg"
          done
          for desktop in traceos-launcher traceos-control traceos-osint traceos-shade traceos; do
            grep -Fq 'Categories=TraceOS;' "/tmp/traceos-root/usr/share/applications/$desktop.desktop"
          done
          echo "[TraceOS] Branded launcher, application category, custom icons and desktop setup are packaged."

          echo "[TraceOS] Checking Investigation Centre tools inside the final squashfs."
          for tool in sherlock maigret h8mail blackbird whois dig; do
            tool_path="$(sudo chroot /tmp/traceos-root /bin/sh -c 'command -v "$1"' sh "$tool")"
            test -n "$tool_path"
            echo "INVESTIGATION_TOOL_${tool}=PASS (${tool_path})"
          done
          for tool in sherlock maigret h8mail blackbird; do
            sudo chroot /tmp/traceos-root /bin/sh -c 'exec "$1" --help >/dev/null' sh "$tool"
            echo "INVESTIGATION_TOOL_${tool}_HELP=PASS"
          done

          echo "[TraceOS] Checking live web testing tools and local image analysis tools."
          for tool in nmap whatweb nikto gobuster sqlmap msfconsole zap.sh java exiftool identify tesseract ffmpeg convert; do
            tool_path="$(sudo chroot /tmp/traceos-root /bin/sh -c 'command -v "$1"' sh "$tool")"
            test -n "$tool_path"
            echo "WORKSTATION_TOOL_${tool}=PASS (${tool_path})"
          done
          test -s /tmp/traceos-root/usr/share/dirb/wordlists/common.txt
          echo "WORKSTATION_TOOL_GOBUSTER_WORDLIST=PASS"

          # Java and ZAP need /proc. The extracted squashfs is not a booted system.
          sudo mount --bind /proc /tmp/traceos-root/proc
          sudo mount --bind /sys /tmp/traceos-root/sys
          cleanup_mounts() {
            sudo umount /tmp/traceos-root/sys || true
            sudo umount /tmp/traceos-root/proc || true
          }
          trap cleanup_mounts EXIT

          # Do not run msfconsole here. Root in an extracted squashfs does not
          # use the Bootsnap warm user, so --version exceeds 90s. Presence is
          # checked above; startup is checked in the booted QEMU CLI workflow.
          while IFS='|' read -r tool arg; do
            test -n "$tool"
            sudo chroot /tmp/traceos-root /bin/sh -c 'timeout 90 "$@" >/dev/null 2>&1' sh "$tool" "$arg"
            echo "WORKSTATION_TOOL_${tool}_SMOKE=PASS"
          done <<'EOF'
          nmap|--version
          whatweb|--version
          nikto|-Version
          gobuster|version
          sqlmap|--version
          exiftool|-ver
          identify|-version
          tesseract|--version
          EOF

          if zap_version="$(sudo chroot /tmp/traceos-root /usr/local/bin/zap -version 2>&1)"; then
            printf '%s\n' "$zap_version"
            printf '%s' "$zap_version" | grep -Fq '2.17.0'
            echo "WORKSTATION_TOOL_zap_version=PASS (2.17.0)"
          else
            zap_status=$?
            printf 'ZAP version command failed (%s):\n%s\n' "$zap_status" "$zap_version" >&2
            sudo chroot /tmp/traceos-root /usr/bin/java -version >&2 || true
            exit "$zap_status"
          fi


      - name: Validate packaged WHOIS and DNS tools
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          root=/tmp/traceos-root
          admindir="$root/var/lib/dpkg"

          test -s "$admindir/status"

          for path in /usr/bin/whois /usr/bin/dig; do
            test -f "$root$path"
            test -x "$root$path"
          done

          # Debian 13/Trixie exposes dnsutils as a virtual package; the actual
          # installed package providing /usr/bin/dig is bind9-dnsutils.
          for package in whois bind9-dnsutils; do
            status="$(dpkg-query --admindir="$admindir" -W -f='${Status}' "$package")"
            version="$(dpkg-query --admindir="$admindir" -W -f='${Version}' "$package")"
            test "$status" = "install ok installed"
            test -n "$version"
            printf 'PACKAGED_PACKAGE=%s STATUS=%s VERSION=%s\n' \
              "$package" "$status" "$version"
          done

          dpkg-query --admindir="$admindir" -L whois | grep -Fx '/usr/bin/whois'
          dpkg-query --admindir="$admindir" -L bind9-dnsutils | grep -Fx '/usr/bin/dig'

          echo "[TraceOS] Packaged WHOIS/DNS filesystem and dpkg-state checks passed."
          echo "[TraceOS] Executable startup is verified separately in the booted QEMU guest."

      - name: Validate bundled security toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate-toolchain.sh
          scripts/validate-toolchain.sh /tmp/traceos-root

      - name: QEMU live-kernel boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf traceos-qemu-live
          mkdir -p traceos-qemu-live
          rm -f traceos-qemu-serial.log traceos-qemu-launch.log

          # Boot the kernel/initrd from the ISO directly. The previous
          # BIOS/serial test could not see the graphical bootloader console
          # on a headless CI runner, even though QEMU stayed alive.
          xorriso -osirrox on -indev live-image-amd64.hybrid.iso \
            -extract /live/vmlinuz traceos-qemu-live/vmlinuz
          xorriso -osirrox on -indev live-image-amd64.hybrid.iso \
            -extract /live/initrd.img traceos-qemu-live/initrd.img

          test -s traceos-qemu-live/vmlinuz
          test -s traceos-qemu-live/initrd.img

          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -m 2048 \
            -smp 2 \
            -drive file=live-image-amd64.hybrid.iso,media=cdrom,readonly=on,format=raw \
            -kernel traceos-qemu-live/vmlinuz \
            -initrd traceos-qemu-live/initrd.img \
            -append "boot=live components username=traceos hostname=traceos console=ttyS0,115200n8" \
            -display none \
            -serial file:traceos-qemu-serial.log \
            -monitor none \
            -snapshot \
            -no-reboot \
            -no-shutdown \
            >traceos-qemu-launch.log 2>&1 &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true' EXIT

          # Give the live kernel/initramfs enough time to start on a shared
          # CI runner under TCG emulation.
          sleep 30

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "[TraceOS] QEMU exited during live-kernel boot." >&2
            cat traceos-qemu-launch.log || true
            cat traceos-qemu-serial.log || true
            exit 1
          fi

          if grep -Eq 'Linux version|Kernel command line|Freeing unused kernel memory|Run /init as init process|live-boot|systemd' traceos-qemu-serial.log; then
            echo "[TraceOS] QEMU live-kernel boot reached Linux userspace."
            tail -n 200 traceos-qemu-serial.log || true
          else
            echo "[TraceOS] QEMU stayed alive but no expected kernel/userspace serial output was observed." >&2
            echo "[TraceOS] QEMU launch log:" >&2
            cat traceos-qemu-launch.log || true
            echo "[TraceOS] QEMU serial log:" >&2
            cat traceos-qemu-serial.log || true
            exit 1
          fi

      - name: QEMU graphical UI screenshot smoke tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-ui-smoke.sh
          scripts/qemu-ui-smoke.sh live-image-amd64.hybrid.iso
          echo "[TraceOS] Graphical screenshots:"
          ls -lh traceos-ui-screenshots/*.png

      - name: Validate QEMU GUI parser fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-ui-smoke.sh
          TRACEOS_QEMU_UI_PARSER_TEST=1 scripts/qemu-ui-smoke.sh live-image-amd64.hybrid.iso

      - name: QEMU packaged ISO CLI synthetic workflow
        if: always()
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/qemu-cli-e2e-smoke.sh
          scripts/qemu-cli-e2e-smoke.sh live-image-amd64.hybrid.iso

      - name: Upload QEMU CLI synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceos-qemu-cli-e2e
          path: |
            traceos-cli-e2e/**
          if-no-files-found: warn

      - name: Attest ISO provenance
        id: attest-iso
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: live-image-amd64.hybrid.iso

      - name: Wait before retrying provenance attestation
        if: steps.attest-iso.outcome == 'failure'
        run: sleep 20

      - name: Retry ISO provenance attestation
        if: steps.attest-iso.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: live-image-amd64.hybrid.iso

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceos-0.1.0-amd64
          path: |
            live-image-amd64.hybrid.iso
            traceos-0.1.0-amd64.iso.sha256
            traceos-iso-layout.txt
            traceos-qemu-serial.log
          if-no-files-found: error

      - name: Upload QEMU screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceos-qemu-ui-screenshots
          path: |
            traceos-ui-screenshots/*.png
            traceos-ui-screenshots/*.cfg
            traceos-ui-screenshots/*.log
            traceos-ui-screenshots/*.txt
          if-no-files-found: warn
