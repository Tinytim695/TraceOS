name: Build TraceOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traceos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            qemu-utils \
            gettext \
            po4a \
            debian-archive-keyring \
            file

      - name: Install pinned live-build
        run: |
          git clone https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build
          git checkout --detach 531cdb98
          sudo make install
          lb --version

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate ISO
        run: |
          test -s live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso
          sha256sum live-image-amd64.hybrid.iso | tee traceos-0.1.0-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceos-0.1.0-amd64
          path: |
            live-image-amd64.hybrid.iso
            traceos-0.1.0-amd64.iso.sha256
          if-no-files-found: error
