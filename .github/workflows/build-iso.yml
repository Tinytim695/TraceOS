name: Build TraceOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: traceos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            qemu-utils \
            qemu-system-x86 \
            gettext \
            po4a \
            debian-archive-keyring \
            file

      - name: Install pinned live-build
        run: |
          git clone https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build
          git checkout --detach 531cdb98
          sudo make install
          lb --version

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate ISO
        run: |
          test -s live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso
          xorriso -indev live-image-amd64.hybrid.iso -report_el_torito plain -report_system_area plain | tee traceos-iso-layout.txt
          grep -q "El Torito" traceos-iso-layout.txt
          sha256sum live-image-amd64.hybrid.iso | tee traceos-0.1.0-amd64.iso.sha256

      - name: QEMU BIOS boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f traceos-qemu-serial.log
          timeout 50s qemu-system-x86_64             -accel tcg,thread=multi             -m 2048             -smp 2             -cdrom live-image-amd64.hybrid.iso             -boot d             -display none             -serial file:traceos-qemu-serial.log             -monitor none             -snapshot             -no-reboot &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true'

          sleep 25

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "[TraceOS] QEMU exited before the boot smoke-test window." >&2
            cat traceos-qemu-serial.log || true
            exit 1
          fi

          if ! grep -Eq 'Linux version|Kernel command line' traceos-qemu-serial.log; then
            echo "[TraceOS] No Linux kernel boot output reached serial." >&2
            cat traceos-qemu-serial.log || true
            exit 1
          fi

          echo "[TraceOS] QEMU BIOS boot smoke test passed."
          cat traceos-qemu-serial.log || true

      - name: Attest ISO provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: live-image-amd64.hybrid.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: traceos-0.1.0-amd64
          path: |
            live-image-amd64.hybrid.iso
            traceos-0.1.0-amd64.iso.sha256
            traceos-iso-layout.txt
            traceos-qemu-serial.log
          if-no-files-found: error
