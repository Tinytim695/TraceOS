<g transform="translate(960 400) scale(1.72)">
  <circle r="150" fill="none" stroke="#e9ffff" stroke-width="3" opacity=".55"/>
  <path d="M-22 -148a150 150 0 0 1 132 74" fill="none" stroke="#efe4ff" stroke-width="5" stroke-linecap="round"/>
