  <circle cx="1180" cy="86" r="1.4"/>
  <circle cx="1340" cy="150" r="1.2"/>
  <circle cx="1510" cy="64" r="1.6"/>
  <circle cx="1680" cy="130" r="1.1"/>
  <circle cx="1810" cy="88" r="1.4"/>
  <circle cx="980" cy="120" r="1.2"/>
  <circle cx="430" cy="240" r="1.1"/>
