<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <!-- The sky and lake stay luminous. Darker shapes are only the ridges, never the whole frame. -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#123a8c"/>
    <stop offset=".34" stop-color="#1d62d6"/>
    <stop offset=".62" stop-color="#3aa4ff"/>
    <stop offset="1" stop-color="#8ad8ff"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx=".5" cy=".36" r=".42">
    <stop offset="0" stop-color="#f3ffff" stop-opacity=".95"/>
    <stop offset=".22" stop-color="#7af6ff" stop-opacity=".72"/>
    <stop offset=".55" stop-color="#2f8dff" stop-opacity=".28"/>
    <stop offset="1" stop-color="#1a62d0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="purpleGlow" cx=".8" cy=".16" r=".42">
    <stop offset="0" stop-color="#c9a6ff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#7a4dff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
    <stop offset=".55" stop-color="#021428" stop-opacity="0"/>
    <stop offset="1" stop-color="#062046" stop-opacity=".42"/>
  </radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ad4ff"/>
    <stop offset=".28" stop-color="#2f8ef0"/>
    <stop offset="1" stop-color="#124888"/>
  </linearGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".28" stop-color="#d9fffb"/>
    <stop offset=".58" stop-color="#5cefff"/>
    <stop offset=".82" stop-color="#3aa7ff"/>
    <stop offset="1" stop-color="#b388ff"/>
  </linearGradient>
  <filter id="soft">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="1080" fill="url(#purpleGlow)"/>
<rect width="1920" height="1080" fill="url(#cyanGlow)"/>

